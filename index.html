<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu Acervo — Biblioteca pessoal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><h1>Meu Acervo</h1><p>Seus livros, e com quem eles estão.</p></header>
  <main>
    <p id="aviso" role="status" hidden></p>
    <section class="painel" aria-labelledby="titulo-form">
      <h2 id="titulo-form">Novo livro</h2>
      <form id="form-livro" novalidate>
        <label>Título <input name="titulo" required maxlength="120"></label>
        <label>Autor <input name="autor" required maxlength="80"></label>
        <label>Categoria <input name="categoria" required maxlength="40" placeholder="Ex.: Romance"></label>
        <label>Ano (opcional) <input name="ano" type="number" inputmode="numeric" min="1000"></label>
        <div class="linha"><button type="submit">Salvar</button><button type="button" id="cancelar" class="sec" hidden>Cancelar edição</button></div>
      </form>
    </section>
    <section class="painel" aria-labelledby="titulo-lista">
      <h2 id="titulo-lista">Acervo</h2>
      <div class="filtros">
        <label>Pesquisar <input id="busca" type="search" placeholder="Título, autor ou categoria"></label>
        <label>Situação
          <select id="filtro"><option value="">Todas</option><option value="disponivel">Disponíveis</option><option value="emprestado">Emprestados</option></select>
        </label>
      </div>
      <ul id="lista"></ul>
      <p id="vazio" hidden>Nenhum livro encontrado.</p>
    </section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
